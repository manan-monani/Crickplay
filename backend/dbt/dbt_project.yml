# Crickplay dbt Project
# Data transformation from Bronze -> Silver -> Gold

name: 'crickplay'
version: '1.0.0'
config-version: 2

profile: 'crickplay'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Model configurations
models:
  crickplay:
    # Bronze layer - raw data, no transformations
    bronze:
      +schema: bronze
      +materialized: view

    # Silver layer - cleaned and typed
    silver:
      +schema: silver
      +materialized: table

    # Gold layer - star schema for analytics
    gold:
      +schema: gold
      +materialized: table
      dimensions:
        +materialized: table
      facts:
        +materialized: incremental
        +unique_key: delivery_id

# Variables
vars:
  # Date range for processing
  start_date: '2018-01-01'
  end_date: '2026-12-31'

  # Tenant isolation (for multi-tenancy)
  tenant_id: null
